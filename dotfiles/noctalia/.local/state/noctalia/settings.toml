[osd.kinds]
keyboard_backlight = false
keyboard_layout = false
lock_keys = false
media = false
privacy = false

[shell]
font_family = "JetBrainsMono Nerd Font Mono"

[theme]
builtin = "Catppuccin"

[wallpaper]
directory = "/home/leonovd/Pictures/walls"
fill_mode = "fit"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/leonovd/Pictures/walls/makima.png"

    [wallpaper.last]
    path = "/home/leonovd/Pictures/walls/makima.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/leonovd/Pictures/walls/makima.png"

[widget.brightness]
enabled = false

[widget.clipboard]
enabled = false

[widget.clock]
format = "%b %d, %H:%M"

[widget.media]
enabled = false

[widget.network]
show_label = false

[widget.taskbar]
enabled = false
only_active_workspace = true

[widget.wallpaper]
enabled = false

[widget.workspaces]
scroll_repeat = "steps"